<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | StudyPlanner Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <a href="app.html" class="logo">StudyPlanner Pro</a>
        <div class="nav-actions">
            <button id="theme-toggle" class="btn btn-secondary">🌓 Theme</button>
            <a href="profile.html" class="btn btn-secondary">👤 Profile</a>
            <button id="logout-button" class="btn btn-primary">Logout</button>
        </div>
    </header>

    <main>
        <section class="hero" style="padding: 3rem 1rem 2rem;">
            <h2 style="font-size: 2.5rem;">Study Dashboard</h2>
            <p>Welcome back! Ready to crush your goals today?</p>
        </section>

        <section class="tool-cards">
            <!-- Schedule Generator -->
            <article class="card">
                <h3>📅 Weekly Planner</h3>
                <p style="margin-bottom: 1.5rem;">Generate a balanced study plan based on your subjects.</p>
                <form id="schedule-form" style="display: flex; flex-direction: column; gap: 0.8rem;">
                    <input type="text" name="title" placeholder="Plan Title (e.g., Finals)" required>
                    <input type="text" name="subjects" placeholder="Subjects (comma separated)" required>
                    <button type="submit" class="btn btn-primary">Generate Schedule</button>
                </form>
                <div id="schedule-list" style="margin-top: 1.5rem;"></div>
            </article>

            <!-- Assignment Tracker -->
            <article class="card">
                <h3>📝 Tasks</h3>
                <p style="margin-bottom: 1.5rem;">Track your upcoming deadlines and priorities.</p>
                <form id="assignment-form" style="display: flex; flex-direction: column; gap: 0.8rem;">
                    <input type="text" name="title" placeholder="Assignment Name" required>
                    <button type="submit" class="btn btn-primary">Add Task</button>
                </form>
                <div id="assignment-list" style="margin-top: 1.5rem;"></div>
            </article>

            <!-- Pomodoro Timer -->
            <article class="card" style="text-align: center;">
                <h3>⏱️ Focus Timer</h3>
                <p style="margin-bottom: 1rem;">Deep work session</p>
                <div id="timer-display" style="font-size: 4rem; font-weight: 800; color: var(--primary); margin-bottom: 1.5rem; font-variant-numeric: tabular-nums;">25:00</div>
                <button id="start-timer" class="btn btn-primary" style="width: 100%; font-size: 1.1rem;">Start Session</button>
            </article>
        </section>
    </main>

    <script type="module" src="Assets/js/main.js"></script>
</body>
</html>
