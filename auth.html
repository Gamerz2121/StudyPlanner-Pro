<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - StudyPlanner Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card card">
            <header style="text-align: center; margin-bottom: 2rem;">
                <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">StudyPlanner Pro</h1>
                <p style="color: var(--text-muted);">Sign in to your dashboard</p>
            </header>

            <form id="login-form">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="name@company.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary">Sign In to Dashboard</button>
            </form>

            <div style="margin-top: 2rem; text-align: center; font-size: 0.875rem;">
                <p style="color: var(--text-muted);">Don't have an account? <a href="#" style="color: var(--primary); font-weight: 600; text-decoration: none;">Create one for free</a></p>
            </div>
        </div>
    </div>

    <script type="module" src="Assets/js/main.js"></script>
</body>
</html>
