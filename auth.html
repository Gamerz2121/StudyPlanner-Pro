<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyPlanner Pro - Sign In</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card card" style="max-width: 400px; margin: 100px auto; padding: 2rem;">
            <header>
                <h1>StudyPlanner Pro</h1>
                <p>Sign in to continue</p>
            </header>

            <div class="auth-forms">
                <!-- Sign In Form -->
                <form id="login-form">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email" required placeholder="you@domain.com">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" name="password" required minlength="6">
                    </div>
                    <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;">Sign In</button>
                </form>

                <hr style="margin: 2rem 0;">

                <p>New user? Fill the form above and click:</p>
                <button id="signup-trigger" class="btn-secondary" style="width: 100%;">Create New Account</button>
            </div>
        </div>
    </div>

    <!-- THE ONLY SCRIPT YOU NEED -->
    <script type="module" src="js/main.js"></script>
    
    <script>
        // Small helper for Signup since we used one form area
        document.getElementById('signup-trigger').addEventListener('click', () => {
            alert("To Sign Up: Simply enter your email/password above and the system will register you on the first try!");
        });
    </script>
</body>
</html>
